[bundle]
name = "validate"
version = "1"
description = "Sidex attribute schemas for the validation extension."
authors = ["Silitics GmbH <info@silitics.com>"]

[backend.rust]
derive = ["Clone", "Debug"]
plugins = []

[backend.rust.types.table]
"::core::builtins::string" = "::std::string::String"
"::core::builtins::Sequence" = "::std::vec::Vec"
"::core::builtins::Map" = "::std::collections::HashMap"
"::core::attrs::Tokens" = "::sidex_ir::TokensValue"
