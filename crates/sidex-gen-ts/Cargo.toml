[package]
name = "sidex-gen-ts"
description = "Sidex code generation for TypeScript."
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dev-dependencies]
sidex-core.workspace = true
sidex-diagnostics.workspace = true
tempfile = "3"

[dependencies]
# Required for code generation.
sidex-gen.workspace = true # PUBLIC
sidex-codegen.workspace = true # PUBLIC
# Required for parsing `rust` attributes.
sidex-attrs-rust.workspace = true # PUBLIC
# Required for parsing `json` attributes.
sidex-attrs-json.workspace = true # PUBLIC
# Required for parsing `validate` attributes.
sidex-attrs-validate.workspace = true # PUBLIC
sidex-validate-expr.workspace = true # PUBLIC
# Required for parsing `deprecated` / `unstable` / `since` attributes.
sidex-attrs-api.workspace = true # PUBLIC
# Required for `sidex-ir` access in plugin lowering.
sidex-ir.workspace = true # PUBLIC
# Required for deserializing the backend configuration.
serde.workspace = true # PUBLIC
serde_json.workspace = true

[lints]
workspace = true
