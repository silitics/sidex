[package]
name = "sidex-serde"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde.workspace = true
# Required for serializing and deserializing Base64 encoded bytes.
base64.workspace = true # PRIVATE
# Required when the `serde_json` feature is on for `SidexType` impls on
# `serde_json::Value` and `serde_json::Map` (used by the JSON opaque
# lowering and `::meta::ir::Value`).
serde_json = { workspace = true, optional = true }
# Required when the `indexmap` feature is on for `SidexType` impls on
# `indexmap::IndexMap` (the order-preserving map used by codegens that
# configure `[backend.rust.types.table] "::core::builtins::Map" =
# "indexmap::IndexMap"`).
indexmap = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
serde-private-content = []
serde_json = ["dep:serde_json"]
indexmap = ["dep:indexmap"]
default = ["serde_json", "indexmap"]

[lints]
workspace = true
