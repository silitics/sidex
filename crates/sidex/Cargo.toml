[package]
name = "sidex"
description = "A format- and language-agnostic data modeling and API definition framework."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64.workspace = true
indexmap.workspace = true
jiff.workspace = true
regex = { workspace = true, optional = true }
rusqlite = { version = "0.37", optional = true, default-features = false }
schemars = { version = "1", optional = true, default-features = false, features = ["std"] }
serde = { workspace = true, optional = true }
sqlx-core = { version = "0.8", optional = true, default-features = false }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
default = ["json", "validation"]
validation = ["dep:regex"]
json = ["dep:serde", "dep:serde_json"]
toml = ["dep:serde", "dep:toml"]
serde-1 = ["json"]
serde_json-1 = ["json"]
schemars-1 = ["dep:schemars", "serde_json-1"]
sqlx-08 = ["dep:sqlx-core"]
rusqlite-037 = ["dep:rusqlite"]
indexmap-2 = []
jiff-02 = []
uuid-1 = ["dep:uuid"]

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_urlencoded = "0.7"

[[test]]
name = "serde"
required-features = ["serde-1"]

[[test]]
name = "json"
required-features = ["json"]

[[test]]
name = "formats"
required-features = ["json", "toml"]

[[test]]
name = "validation"
required-features = ["validation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
