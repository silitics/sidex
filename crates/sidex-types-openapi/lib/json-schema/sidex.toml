[bundle]
name = "json_schema"
version = "1"
description = "Sidex schema for JSON Schema."
authors = ["Silitics GmbH <info@silitics.com>"]

[backend.json-schema]

[backend.rust]
derive = ["Clone", "Debug"]
plugins = ["builder", "serde"]

[backend.rust.types.table]
"::core::builtins::string" = "::std::string::String"
"::core::builtins::Sequence" = "::std::vec::Vec"
