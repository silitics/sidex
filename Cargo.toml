[workspace]
resolver = "2"
members = ["crates/*"]

# Each crate inherits these via `[lints] workspace = true`. Add lints here
# rather than per-crate so the policy stays consistent across the workspace.
[workspace.lints.clippy]

[workspace.package]
# All crates share the release version and depend on each other exactly.
version = "0.4.0"
edition = "2024"
authors = ["Silitics GmbH <info@silitics.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/silitics/sidex"
homepage = "https://oss.silitics.com/sidex"

[workspace.dependencies]
# Internal crates.
sidex = { path = "crates/sidex", version = "=0.4.0" }
sidex-attrs-json = { path = "crates/sidex-attrs-json", version = "=0.4.0" }
sidex-attrs-py = { path = "crates/sidex-attrs-py", version = "=0.4.0" }
sidex-attrs-rust = { path = "crates/sidex-attrs-rust", version = "=0.4.0" }
sidex-attrs-api = { path = "crates/sidex-attrs-api", version = "=0.4.0" }
sidex-attrs-validate = { path = "crates/sidex-attrs-validate", version = "=0.4.0" }
sidex-validate-expr = { path = "crates/sidex-validate-expr", version = "=0.4.0" }
sidex-build-rs = { path = "crates/sidex-build-rs", version = "=0.4.0" }
sidex-codegen = { path = "crates/sidex-codegen", version = "=0.4.0" }
sidex-codegen-macros = { path = "crates/sidex-codegen-macros", version = "=0.4.0" }
sidex-codegen-syntax = { path = "crates/sidex-codegen-syntax", version = "=0.4.0" }
sidex-core = { path = "crates/sidex-core", version = "=0.4.0" }
sidex-diagnostics = { path = "crates/sidex-diagnostics", version = "=0.4.0" }
sidex-fmt = { path = "crates/sidex-fmt", version = "=0.4.0" }
sidex-fuzz = { path = "crates/sidex-fuzz", version = "=0.4.0" }
sidex-gen = { path = "crates/sidex-gen", version = "=0.4.0" }
sidex-gen-ir = { path = "crates/sidex-gen-ir", version = "=0.4.0" }
sidex-gen-json-schema = { path = "crates/sidex-gen-json-schema", version = "=0.4.0" }
sidex-gen-py = { path = "crates/sidex-gen-py", version = "=0.4.0" }
sidex-gen-rs = { path = "crates/sidex-gen-rs", version = "=0.4.0" }
sidex-gen-ts = { path = "crates/sidex-gen-ts", version = "=0.4.0" }
sidex-ir = { path = "crates/sidex-ir", version = "=0.4.0" }
sidex-syntax = { path = "crates/sidex-syntax", version = "=0.4.0" }
sidex-types-json-schema = { path = "crates/sidex-types-json-schema", version = "=0.4.0" }
sidex-types-openapi = { path = "crates/sidex-types-openapi", version = "=0.4.0" }

sidex-serde-tests = { path = "crates/sidex-serde-tests" }

# External crates.
anyhow = "1"
ariadne = "0.1"
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4.0", features = ["derive"] }
color-eyre = "0.6"
eyre = "0.6"
futures = "*"
hashbrown = "0.13"
indexmap = { version = "2", features = ["serde"] }
insta = { version = "1.21", features = ["glob"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
lazy_static = "1.4"
once_cell = "1.13"
parking_lot = "0.12"
proc-macro2 = "1"
regex = "1"
semver = "1"
quote = "1"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.5"
scoped-tls = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["extra-traits"] }
thiserror = "1"
toml = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", default-features = false, features = ["std"] }
yansi = "0.5"
