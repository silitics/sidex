[workspace]
resolver = "2"
members = ["crates/*"]

# Each crate inherits these via `[lints] workspace = true`. Add lints here
# rather than per-crate so the policy stays consistent across the workspace.
[workspace.lints.clippy]

[workspace.package]
# We have no `version` here because the different crates can evolve independently.
edition = "2024"
authors = ["Silitics GmbH <info@silitics.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/silitics/sidex"
homepage = "https://oss.silitics.com/sidex"

[workspace.dependencies]
# Internal crates.
sidex = { path = "crates/sidex", version = "0.1" }
sidex-attrs-json = { path = "crates/sidex-attrs-json", version = "0.1" }
sidex-attrs-py = { path = "crates/sidex-attrs-py", version = "0.1" }
sidex-attrs-rust = { path = "crates/sidex-attrs-rust", version = "0.1" }
sidex-build-rs = { path = "crates/sidex-build-rs", version = "0.1" }
sidex-codegen = { path = "crates/sidex-codegen", version = "0.1" }
sidex-codegen-macros = { path = "crates/sidex-codegen-macros", version = "0.1" }
sidex-codegen-syntax = { path = "crates/sidex-codegen-syntax", version = "0.1" }
sidex-core = { path = "crates/sidex-core", version = "0.1" }
sidex-diagnostics = { path = "crates/sidex-diagnostics", version = "0.1" }
sidex-fmt = { path = "crates/sidex-fmt", version = "0.1" }
sidex-fuzz = { path = "crates/sidex-fuzz", version = "0.1" }
sidex-gen = { path = "crates/sidex-gen", version = "0.1" }
sidex-gen-ir = { path = "crates/sidex-gen-ir", version = "0.1" }
sidex-gen-json-schema = { path = "crates/sidex-gen-json-schema", version = "0.1" }
sidex-gen-py = { path = "crates/sidex-gen-py", version = "0.1" }
sidex-gen-rs = { path = "crates/sidex-gen-rs", version = "0.1" }
sidex-gen-ts = { path = "crates/sidex-gen-ts", version = "0.1" }
sidex-ir = { path = "crates/sidex-ir", version = "0.2" }
sidex-serde = { path = "crates/sidex-serde", version = "0.1" }
sidex-syntax = { path = "crates/sidex-syntax", version = "0.2" }
sidex-types-json-schema = { path = "crates/sidex-types-json-schema", version = "0.1" }
sidex-types-openapi = { path = "crates/sidex-types-openapi", version = "0.1" }

# External crates.
anyhow = "1"
ariadne = "0.1"
base64 = "0.20"
clap = { version = "4.0", features = ["derive"] }
color-eyre = "0.6"
eyre = "0.6"
futures = "*"
hashbrown = "0.13"
indexmap = { version = "2", features = ["serde"] }
insta = { version = "1.21", features = ["glob"] }
lazy_static = "1.4"
once_cell = "1.13"
parking_lot = "0.12"
proc-macro2 = "1"
quote = "1"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.5"
scoped-tls = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["extra-traits"] }
thiserror = "1"
toml = "0.5"
yansi = "0.5"
