name: Build Distributions

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build; empty uses the caller's commit.
        type: string
        default: ""
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install TypeScript for the npm libraries
        run: npm install --global typescript@6.0.3
      - name: Prepare npm libraries, launcher, and release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python packaging/npm.py prepare --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-common
          path: dist/npm/*.tgz
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      SIDEX_GIT_VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.15"
      - name: Prepare output directory for the container build
        run: mkdir -p dist/python
      - name: Build Python wheel and native binary
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          rust-toolchain: "1.99.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          docker-options: -e SIDEX_GIT_VERSION
          args: --release --locked --out dist/python
      - name: Pack npm binary and standalone archive
        env:
          TARGET: ${{ matrix.target }}
        run: python packaging/npm.py binary --target "$TARGET" --binary "target/$TARGET/release/sidex"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-common
          path: dist/npm
      - name: Test installed distributions
        if: matrix.libc != 'musl'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python packaging/test.py --target "$TARGET" --version "$VERSION"
      - name: Test installed distributions on Alpine
        if: matrix.libc == 'musl'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/io:ro" -w /io python:3.12-alpine sh -ec '
            apk add --no-cache nodejs npm
            # A stalled read fails the whole download, so allow slow mirrors.
            pip install --timeout 120 uv==0.12.15
            python packaging/test.py --target "$1" --version "$2"
          ' sh "$TARGET" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/sidex-cli-${{ matrix.platform }}-*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.target }}
          path: dist/python/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/archives/*.tar.gz
          if-no-files-found: error
