name: Run Checks

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      skip-distributions:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-run-tests:
    name: "Rust and Language Integration Tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install TypeScript for the runtime integration test
        run: npm install --global typescript@6.0.3
      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked
      - name: Check Rust with Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          version: "0.12.15"
      - name: Run Python integration tests
        run: uv run --project tests/py --locked pytest -v

  rust-check-fmt:
    name: "Rust: Check Formatting"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: nightly-2026-07-14
          components: rustfmt
      - run: cargo +nightly-2026-07-14 fmt --all -- --check

  docs-check:
    name: "Documentation"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidex-docs
          path: www/dist
          if-no-files-found: error
      - name: Prepare Site Archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/sidex
          cp -a dist/. site/sidex/
      - name: Deploy Documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: silitics/actions/deploy-site@6895ba660c00c49412d65c87815d0a9c30f88151
        with:
          domain: oss.silitics.com
          source-dir: www/site
          s3-access-key: ${{ vars.SILITICS_SITES_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SILITICS_SITES_SECRET_KEY }}

  distributions:
    if: ${{ !inputs.skip-distributions }}
    uses: ./.github/workflows/build-distributions.yml
